name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run test suite (fake agents, no network)
        run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONIOENCODING: utf-8

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build (with the runner's UID so the bind-mounted checkout is writable)
        run: EB_UID=$(id -u) EB_GID=$(id -g) docker compose build
      - name: Start and wait for health
        run: |
          EB_UID=$(id -u) EB_GID=$(id -g) EB_SKIP_FETCH=1 docker compose up -d
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' english-boost); echo "$s"
            [ "$s" = healthy ] && break; sleep 3
          done
          [ "$s" = healthy ]
          curl -fsS http://127.0.0.1:8765/api/health
          docker compose exec -T app bash -c 'claude --version && codex --version && test -x /usr/local/bin/codex-code-mode-host && rg --version | head -1'
      - name: Test suite inside the container
        run: docker compose exec -T app python3 -m unittest discover -s tests -t .
      - name: Logs
        if: always()
        run: docker compose logs --tail 50
