name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run test suite (fake agents, no network)
        run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONIOENCODING: utf-8

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker compose build
      - name: Start and wait for health
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' english-boost); echo "$s"
            [ "$s" = healthy ] && break; sleep 3
          done
          [ "$s" = healthy ]
          curl -fsS http://127.0.0.1:8765/api/health
          docker compose exec -T app bash -c 'claude --version && codex --version && test -x /usr/local/bin/codex-code-mode-host && rg --version | head -1'
      - name: Test suite inside the container
        run: docker compose exec -T app python3 -m unittest discover -s tests -t .
      - name: Logs
        if: always()
        run: docker compose logs --tail 50
