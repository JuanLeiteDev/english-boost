<nav class="rail" aria-label="Navegação">
  <div class="logo" aria-hidden="true">EB</div>
  <a class="nav" href="#study" data-view="study" data-tip="Estudar" aria-label="Estudar"><svg class="i"><use href="#i-chat"/></svg><span class="lbl">Estudar</span></a>
  <a class="nav" href="#grammar" data-view="grammar" data-tip="Gramática" aria-label="Gramática"><svg class="i"><use href="#i-book"/></svg><span class="lbl">Gramática</span></a>
  <a class="nav" href="#progress" data-view="progress" data-tip="Progresso" aria-label="Progresso"><svg class="i"><use href="#i-chart"/></svg><span class="lbl">Progresso</span></a>
  <a class="nav" href="#resources" data-view="resources" data-tip="Recursos" aria-label="Recursos"><svg class="i"><use href="#i-library"/></svg><span class="lbl">Recursos</span></a>
  <div class="rail-spacer"></div>
  <button class="nav" id="btn-settings" data-tip="Definições" aria-label="Definições"><svg class="i"><use href="#i-sliders"/></svg><span class="lbl">Ajustes</span></button>
</nav>

<main>
  <section class="view" id="view-study">
    <div class="chat">
      <header class="chat-head">
        <div class="seg" id="agent-seg" role="tablist" aria-label="Agente">
          <span class="thumb"></span>
          <button data-agent="claude" role="tab"><span class="status-dot" data-dot="claude"></span>Claude</button>
          <button data-agent="codex" role="tab"><span class="status-dot" data-dot="codex"></span>Codex</button>
        </div>
        <div class="head-actions">
          <button class="icon" id="btn-new" title="Nova conversa" aria-label="Nova conversa"><svg class="i"><use href="#i-plus"/></svg></button>
          <button class="icon" id="btn-panel" title="Painel" aria-label="Mostrar painel"><svg class="i"><use href="#i-panel"/></svg></button>
        </div>
      </header>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="composer">
        <div class="chips" id="chips-inline"></div>
        <div class="box">
          <textarea id="input" rows="1" placeholder="Escreve ou fala em inglês" aria-label="Mensagem"></textarea>
          <button class="icon" id="btn-mic" title="Falar (inglês)" aria-label="Ditado"><svg class="i"><use href="#i-mic"/></svg></button>
          <button class="send" id="btn-send" title="Enviar" aria-label="Enviar"><svg class="i"><use href="#i-up"/></svg></button>
        </div>
        <div class="hint"><kbd>Enter</kbd> enviar · <kbd>Shift</kbd> + <kbd>Enter</kbd> nova linha</div>
      </div>
    </div>
    <aside class="panel" id="panel" aria-label="Painel">
      <header class="panel-head">
        <div class="seg" id="panel-tabs" role="tablist">
          <span class="thumb"></span>
          <button data-tab="today" role="tab">Hoje</button>
          <button data-tab="unit" role="tab">Exercício</button>
          <button data-tab="doc" role="tab">Documento</button>
        </div>
        <button class="icon" id="btn-panel-close" title="Fechar" aria-label="Fechar painel"><svg class="i"><use href="#i-x"/></svg></button>
      </header>
      <div class="panel-body" id="panel-today"></div>
      <div class="panel-body" id="panel-unit"></div>
      <div class="panel-body" id="panel-doc"></div>
    </aside>
  </section>

  <section class="view page" id="view-grammar">
    <div class="page-head">
      <div><div class="eyebrow">Espinha de gramática</div><h1>Gramática</h1><p id="g-sub"></p></div>
    </div>
    <div class="filters">
      <div class="seg" id="g-filter">
        <span class="thumb"></span>
        <button data-f="all">Todas</button>
        <button data-f="todo">Por fazer</button>
        <button data-f="redo">A repetir</button>
        <button data-f="done">Concluídas</button>
      </div>
      <div class="legend"><span><i class="st st-done"></i>dominada</span><span><i class="st st-ok"></i>feita</span><span><i class="st st-redo"></i>repetir</span><span><i class="st st-todo"></i>por fazer</span></div>
    </div>
    <div class="units" id="units"></div>
  </section>

  <section class="view page" id="view-progress">
    <div class="page-head">
      <div><div class="eyebrow">Até 01/02/2027</div><h1>Progresso</h1><p id="p-sub"></p></div>
      <button class="btn ghost" id="btn-git"><svg class="i sm"><use href="#i-cloud"/></svg><span>Guardar no Git</span></button>
    </div>
    <div id="progress"></div>
  </section>

  <section class="view page" id="view-resources">
    <div class="page-head">
      <div><div class="eyebrow">Materiais e plano</div><h1>Recursos</h1></div>
      <a class="btn quiet sm" href="/guia" target="_blank" rel="noopener">Guia <svg class="i sm"><use href="#i-external"/></svg></a>
    </div>
    <div><div class="seg" id="res-seg">
      <span class="thumb"></span>
      <button data-doc="resources/catalog.md">Links</button>
      <button data-doc="plan/master-plan.md">Plano</button>
      <button data-doc="@week">Semana</button>
      <button data-doc="research/2026-11-24-fundamentacao.md">Estudos</button>
    </div></div>
    <article class="doc" id="res-doc"></article>
  </section>
</main>

<dialog id="dlg-close">
  <form method="dialog" class="form">
    <div class="form-head"><h2>Terminar sessão</h2><button class="icon" value="cancel" aria-label="Fechar"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="grid2">
      <label>Minutos <input name="minutes" type="number" min="0" max="400"></label>
      <label>Palavras novas <input name="words" type="number" min="0" value="8"></label>
      <label>Gramática <input name="grammar"></label>
      <label>% gramática <input name="pct" type="number" min="0" max="100"></label>
      <label class="full">Listening <input name="listening"></label>
      <label>Output
        <select name="output"><option>speaking</option><option>writing</option><option>review</option><option>checkpoint</option></select></label>
      <label>Notas <input name="notes" placeholder="opcional"></label>
    </div>
    <div class="row-end"><button value="cancel" class="btn ghost">Cancelar</button><button value="ok" class="btn">Guardar sessão</button></div>
  </form>
</dialog>

<dialog id="dlg-settings">
  <form method="dialog" class="form">
    <div class="form-head"><h2>Definições</h2><button class="icon" value="cancel" aria-label="Fechar"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="grid2">
      <label>Modelo Codex <select name="codex_model" id="set-codex"></select></label>
      <label>Modelo Claude
        <select name="claude_model"><option value="">Padrão</option><option value="opus">Opus</option><option value="sonnet">Sonnet</option><option value="haiku">Haiku</option></select></label>
      <label class="full">Caminho do Claude <input name="claude_bin" id="set-cbin" placeholder="automático"></label>
      <label class="full">Caminho do Codex <input name="codex_bin" id="set-xbin" placeholder="automático"></label>
    </div>
    <p class="note" id="set-status"></p>
    <div class="row-end"><button value="cancel" class="btn ghost">Fechar</button><button value="ok" class="btn">Guardar</button></div>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script src="/static/md.js"></script>
<script src="/static/grading.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
